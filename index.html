
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MiniMarbleMazeMaker</title>
    
    <!-- Tailwind for modern, sleek UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Robust, standard Three.js imports that work universally -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>

    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none; /* Prevent swipe-to-refresh on mobile */
        }
        
        #canvas-container { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 0; 
            outline: none;
        }

        /* Glassmorphism utilities */
        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom toggle switch */
        .toggle-checkbox:checked { right: 0; border-color: #10b981; }
        .toggle-checkbox:checked + .toggle-label { background-color: #10b981; }
        .toggle-checkbox { right: 4px; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
        .toggle-label { width: 3rem; height: 1.5rem; background-color: #475569; border-radius: 9999px; transition: all 0.3s; }
    </style>
</head>
<body class="w-screen h-screen">

    <!-- Fullscreen 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Floating UI Layer -->
    <div class="fixed inset-0 z-10 pointer-events-none flex flex-col justify-between sm:justify-start p-4 sm:p-6 w-full h-full box-border">
        
        <!-- Header & Controls Card -->
        <div class="pointer-events-auto glass rounded-2xl p-5 shadow-2xl w-full sm:w-80 flex flex-col gap-5 mt-auto sm:mt-0 max-h-[85vh] overflow-y-auto">
            
            <!-- Title -->
            <div>
                <h1 class="text-2xl font-black bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">MiniMarbleMaze<br>Maker</h1>
                <p class="text-xs text-slate-400 mt-1">40x3.5mm Print-in-Place Maze</p>
            </div>

            <!-- Print Instructions -->
            <div class="bg-blue-900/30 border border-blue-500/30 rounded-xl p-3">
                <p class="text-xs text-blue-200 leading-relaxed">
                    <strong class="text-blue-400">Pro-Tip:</strong> Set a pause in your slicer just before the top 0.8mm shell prints. Drop in a <strong>1.5mm - 2mm steel ball</strong>, then resume!
                </p>
            </div>

            <!-- Controls -->
            <div class="flex items-center justify-between mt-2">
                <span class="text-sm font-medium text-slate-300">Preview Top Shell</span>
                <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="toggleTop" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer top-0 bottom-0 m-auto"/>
                    <label for="toggleTop" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex flex-col gap-3 mt-2">
                <button id="btnGenerate" class="w-full py-3.5 px-4 bg-slate-700/80 hover:bg-slate-600 active:bg-slate-500 text-white font-semibold rounded-xl transition shadow-lg flex items-center justify-center gap-2 border border-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Regenerate Maze
                </button>
                <button id="btnDownload" class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 active:scale-[0.98] text-white font-bold rounded-xl transition shadow-[0_0_15px_rgba(6,182,212,0.4)] flex items-center justify-center gap-2 border border-cyan-400/50">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download STL
                </button>
            </div>
        </div>

        <!-- Legend (Top Right on desktop, top center on mobile) -->
        <div class="absolute top-4 right-4 left-4 sm:left-auto pointer-events-auto flex justify-center sm:justify-end gap-3">
            <div class="glass px-3 py-1.5 rounded-full flex items-center gap-2">
                <div class="w-2.5 h-2.5 rounded-full bg-white shadow-[0_0_5px_#fff]"></div>
                <span class="text-xs font-semibold tracking-wide">START</span>
            </div>
            <div class="glass px-3 py-1.5 rounded-full flex items-center gap-2">
                <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_5px_#34d399]"></div>
                <span class="text-xs font-semibold tracking-wide text-emerald-100">GOAL</span>
            </div>
        </div>

    </div>

    <script>
        // --- Specifications ---
        const SPEC = {
            radius: 20.0,
            thickness: 3.5,
            shell: 0.8,
            outerWall: 1.0,
            wallWidth: 0.8,
            centerRadius: 4.0,
            rings: 6,
            ringCounts: [1, 8, 16, 16, 32, 32]
        };
        const MAZE_HEIGHT = SPEC.thickness - (2 * SPEC.shell); // 1.9mm
        const INNER_RADIUS = SPEC.radius - SPEC.outerWall; // 19.0mm
        const RING_WIDTH = (INNER_RADIUS - SPEC.centerRadius) / (SPEC.rings - 1); 

        // --- State ---
        let scene, camera, renderer, controls;
        let chipGroup, markersGroup, topMesh;
        let nodes = [];
        let endCellIndex = 0;

        // --- Initialization ---
        initApp();

        function initApp() {
            const container = document.getElementById('canvas-container');
            
            // 1. Scene Setup
            scene = new THREE.Scene();

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 45, 45);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.1; // Don't go too far below
            controls.target.set(0, 0, 0);
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.5;

            // 5. Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(15, 30, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 100;
            const d = 25;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            const backLight = new THREE.DirectionalLight(0x38bdf8, 0.4);
            backLight.position.set(-15, 10, -20);
            scene.add(backLight);

            // 6. Handle Window Resize
            window.addEventListener('resize', onWindowResize, false);

            // 7. Stop rotation on interaction
            container.addEventListener('pointerdown', () => controls.autoRotate = false);

            // 8. Bind UI
            document.getElementById('btnGenerate').addEventListener('click', generateChip);
            document.getElementById('btnDownload').addEventListener('click', downloadSTL);
            document.getElementById('toggleTop').addEventListener('change', (e) => {
                if(topMesh) topMesh.visible = e.target.checked;
            });

            // 9. Generate Initial Model & Start Loop
            generateChip();
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // --- Logic: Maze Generation ---
        function generateMazeGraph() {
            nodes = [];
            for (let r = 1; r < SPEC.rings; r++) {
                nodes[r] = [];
                for (let c = 0; c < SPEC.ringCounts[r]; c++) {
                    nodes[r][c] = { r, c, visited: false, links: [] };
                }
            }

            const getUnvisitedNeighbors = (r, c) => {
                const n = [];
                const cPrev = (c - 1 + SPEC.ringCounts[r]) % SPEC.ringCounts[r];
                const cNext = (c + 1) % SPEC.ringCounts[r];
                if (!nodes[r][cPrev].visited) n.push(nodes[r][cPrev]);
                if (!nodes[r][cNext].visited) n.push(nodes[r][cNext]);

                if (r > 1) {
                    const cInner = Math.floor(c * SPEC.ringCounts[r-1] / SPEC.ringCounts[r]);
                    if (!nodes[r-1][cInner].visited) n.push(nodes[r-1][cInner]);
                }

                if (r < SPEC.rings - 1) {
                    const ratio = SPEC.ringCounts[r+1] / SPEC.ringCounts[r];
                    for (let i = 0; i < ratio; i++) {
                        const cOuter = c * ratio + i;
                        if (!nodes[r+1][cOuter].visited) n.push(nodes[r+1][cOuter]);
                    }
                }
                return n;
            };

            const stack = [];
            const startNode = nodes[1][0]; // Entry point from center
            startNode.visited = true;
            stack.push(startNode);

            // Depth First Search for perfect maze
            while (stack.length > 0) {
                const current = stack[stack.length - 1];
                const unvisited = getUnvisitedNeighbors(current.r, current.c);
                if (unvisited.length > 0) {
                    const next = unvisited[Math.floor(Math.random() * unvisited.length)];
                    current.links.push(next);
                    next.links.push(current);
                    next.visited = true;
                    stack.push(next);
                } else {
                    stack.pop();
                }
            }

            // Pick a random spot in the outermost ring for the goal
            endCellIndex = Math.floor(Math.random() * SPEC.ringCounts[SPEC.rings-1]);
        }

        function areLinked(n1, n2) {
            return n1.links.includes(n2);
        }

        // --- Logic: 3D Geometry ---
        function createRadialWall(theta, rIn, rOut, w) {
            const shape = new THREE.Shape();
            const dirX = Math.cos(theta), dirY = Math.sin(theta);
            const normX = -dirY, normY = dirX;

            const rInAdj = rIn - w/2 + 0.05;
            const rOutAdj = rOut + w/2 - 0.05;

            const p1x = rInAdj * dirX + (w/2) * normX, p1y = rInAdj * dirY + (w/2) * normY;
            const p2x = rOutAdj * dirX + (w/2) * normX, p2y = rOutAdj * dirY + (w/2) * normY;
            const p3x = rOutAdj * dirX - (w/2) * normX, p3y = rOutAdj * dirY - (w/2) * normY;
            const p4x = rInAdj * dirX - (w/2) * normX, p4y = rInAdj * dirY - (w/2) * normY;

            shape.moveTo(p1x, p1y);
            shape.lineTo(p2x, p2y);
            shape.lineTo(p3x, p3y);
            shape.lineTo(p4x, p4y);
            shape.lineTo(p1x, p1y);
            return shape;
        }

        function createArcWall(R, theta1, theta2, w) {
            const shape = new THREE.Shape();
            const rOuter = R + w/2;
            const rInner = R - w/2;
            shape.moveTo(rOuter * Math.cos(theta1), rOuter * Math.sin(theta1));
            shape.absarc(0, 0, rOuter, theta1, theta2, false);
            shape.lineTo(rInner * Math.cos(theta2), rInner * Math.sin(theta2));
            shape.absarc(0, 0, rInner, theta2, theta1, true);
            shape.lineTo(rOuter * Math.cos(theta1), rOuter * Math.sin(theta1));
            return shape;
        }

        function clearGroup(group) {
            if (!group) return;
            group.traverse(child => {
                if (child.isMesh) {
                    child.geometry.dispose();
                    if(child.material.dispose) child.material.dispose();
                }
            });
            scene.remove(group);
        }

        function generateChip() {
            clearGroup(chipGroup);
            clearGroup(markersGroup);

            chipGroup = new THREE.Group();
            markersGroup = new THREE.Group();
            generateMazeGraph();

            // Nice dark plastic material
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x1e293b, // Slate 800
                roughness: 0.4, 
                metalness: 0.2 
            });

            // 1. Base Plate
            const baseGeo = new THREE.CylinderGeometry(SPEC.radius, SPEC.radius, SPEC.shell, 64);
            baseGeo.translate(0, SPEC.shell / 2, 0);
            const baseMesh = new THREE.Mesh(baseGeo, material);
            baseMesh.receiveShadow = true;
            baseMesh.castShadow = true;
            chipGroup.add(baseMesh);

            // 2. Outer Rim
            const rimShape = new THREE.Shape();
            rimShape.moveTo(SPEC.radius, 0);
            rimShape.absarc(0, 0, SPEC.radius, 0, Math.PI * 2, false);
            const rimHole = new THREE.Path();
            rimHole.moveTo(INNER_RADIUS, 0);
            rimHole.absarc(0, 0, INNER_RADIUS, 0, Math.PI * 2, true);
            rimShape.holes.push(rimHole);
            
            const rimGeo = new THREE.ExtrudeGeometry(rimShape, { depth: MAZE_HEIGHT, bevelEnabled: false, curveSegments: 64 });
            rimGeo.rotateX(-Math.PI / 2);
            rimGeo.translate(0, SPEC.shell, 0);
            const rimMesh = new THREE.Mesh(rimGeo, material);
            rimMesh.receiveShadow = true;
            rimMesh.castShadow = true;
            chipGroup.add(rimMesh);

            // 3. Build Maze Geometry
            const mazeShapes = [];
            
            // Inner barrier (leave cell 0 open)
            for (let c = 1; c < SPEC.ringCounts[1]; c++) {
                const t1 = c * 2 * Math.PI / SPEC.ringCounts[1];
                const t2 = (c+1) * 2 * Math.PI / SPEC.ringCounts[1];
                mazeShapes.push(createArcWall(SPEC.centerRadius, t1, t2, SPEC.wallWidth));
            }

            for (let r = 1; r < SPEC.rings; r++) {
                for (let c = 0; c < SPEC.ringCounts[r]; c++) {
                    const nextC = (c + 1) % SPEC.ringCounts[r];
                    
                    // Radial lines blocking movement
                    if (!areLinked(nodes[r][c], nodes[r][nextC])) {
                        const theta = (c + 1) * 2 * Math.PI / SPEC.ringCounts[r];
                        const rIn = SPEC.centerRadius + (r - 1) * RING_WIDTH;
                        const rOut = SPEC.centerRadius + r * RING_WIDTH;
                        mazeShapes.push(createRadialWall(theta, rIn, rOut, SPEC.wallWidth));
                    }

                    // Arc lines blocking movement
                    if (r < SPEC.rings - 1) {
                        const ratio = SPEC.ringCounts[r+1] / SPEC.ringCounts[r];
                        for (let i = 0; i < ratio; i++) {
                            const cOuter = c * ratio + i;
                            if (!areLinked(nodes[r][c], nodes[r+1][cOuter])) {
                                const t1 = cOuter * 2 * Math.PI / SPEC.ringCounts[r+1];
                                const t2 = (cOuter + 1) * 2 * Math.PI / SPEC.ringCounts[r+1];
                                const arcR = SPEC.centerRadius + r * RING_WIDTH;
                                mazeShapes.push(createArcWall(arcR, t1, t2, SPEC.wallWidth));
                            }
                        }
                    }
                }
            }

            if (mazeShapes.length > 0) {
                const mazeGeo = new THREE.ExtrudeGeometry(mazeShapes, { depth: MAZE_HEIGHT, bevelEnabled: false, curveSegments: 12 });
                mazeGeo.rotateX(-Math.PI / 2);
                mazeGeo.translate(0, SPEC.shell, 0);
                const mazeMesh = new THREE.Mesh(mazeGeo, material);
                mazeMesh.receiveShadow = true;
                mazeMesh.castShadow = true;
                chipGroup.add(mazeMesh);
            }

            // 4. Top Shell
            const topGeo = new THREE.CylinderGeometry(SPEC.radius, SPEC.radius, SPEC.shell, 64);
            topGeo.translate(0, SPEC.shell + MAZE_HEIGHT + (SPEC.shell / 2), 0);
            topMesh = new THREE.Mesh(topGeo, material);
            topMesh.castShadow = true;
            topMesh.receiveShadow = true;
            topMesh.visible = document.getElementById('toggleTop').checked;
            chipGroup.add(topMesh);

            scene.add(chipGroup);

            // 5. Setup Markers
            const ballGeo = new THREE.SphereGeometry(1.0, 16, 16);
            const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0.8 });
            const startMarker = new THREE.Mesh(ballGeo, ballMat);
            startMarker.position.set(0, SPEC.shell + MAZE_HEIGHT/2, 0); 
            markersGroup.add(startMarker);

            const goalGeo = new THREE.CylinderGeometry(1.4, 1.4, 0.4, 16);
            const goalMat = new THREE.MeshStandardMaterial({ color: 0x34d399, emissive: 0x059669 });
            const goalMarker = new THREE.Mesh(goalGeo, goalMat);
            
            const endAngle = (endCellIndex + 0.5) * 2 * Math.PI / SPEC.ringCounts[SPEC.rings-1];
            const endR = SPEC.centerRadius + (SPEC.rings - 1.5) * RING_WIDTH;
            goalMarker.position.set(
                endR * Math.cos(endAngle),
                SPEC.shell + 0.2,
                -endR * Math.sin(endAngle)
            );
            markersGroup.add(goalMarker);

            scene.add(markersGroup);
        }

        function downloadSTL() {
            const originalTopVisibility = topMesh.visible;
            topMesh.visible = true; // Force top on for printing

            const exporter = new THREE.STLExporter();
            const stlString = exporter.parse(chipGroup); // Export ONLY chip, not markers

            topMesh.visible = originalTopVisibility;

            const blob = new Blob([stlString], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.style.display = 'none';
            link.href = url;
            link.download = 'MiniMarbleMaze.stl';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
